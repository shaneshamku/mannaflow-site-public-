services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `hvac` schema Prisma's multiSchema config expects, before
      # the app ever connects — see prisma/schema.prisma's `schemas = ["hvac"]`.
      - ./prisma/create-schema.sql:/docker-entrypoint-initdb.d/01-create-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
